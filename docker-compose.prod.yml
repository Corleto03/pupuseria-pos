services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pupuseria-pos-app:latest
    container_name: pupuseria-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_ADMIN_URL=${DATABASE_ADMIN_URL}
      - JWT_SECRET=${JWT_SECRET}
      - BOOTSTRAP_SUPERADMIN_EMAIL=${BOOTSTRAP_SUPERADMIN_EMAIL}
      - BOOTSTRAP_SUPERADMIN_PASSWORD=${BOOTSTRAP_SUPERADMIN_PASSWORD}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pupuseria-net

  db:
    image: postgres:16-alpine
    container_name: pupuseria-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pupuseria}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1536M
    volumes:
      - pupuseria_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pupuseria}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pupuseria-net

volumes:
  pupuseria_data:

networks:
  pupuseria-net:
    driver: bridge
