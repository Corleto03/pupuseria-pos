services:
  db:
    image: postgres:16-alpine
    container_name: pupuseria-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pupuseria
    ports:
      - "5432:5432"
    volumes:
      - pupuseria_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pupuseria"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pupuseria_data:
